<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI SUMMER SCHOOL Day4 | 実務で使える最新画像AI</title>
  <link rel="stylesheet" href="day04_styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="rail" aria-label="スライド一覧">
      <div class="rail__inner">
        <p class="rail__eyebrow">AI-Fukuoka</p>
        <h1 class="rail__title">AI SUMMER SCHOOL Day4</h1>
        <p class="rail__subtitle">画像ベーススライド / 実務で使える最新画像AI</p>

        <nav class="toc">
          <a class="toc__link" href="#slide-1">1 表紙</a>
          <a class="toc__link" href="#slide-2">2 対話型デザイン</a>
          <a class="toc__link" href="#slide-3">3 4つの使い分け</a>
          <a class="toc__link" href="#slide-4">4 6つの実務</a>
          <a class="toc__link" href="#slide-5">5 安全な商用利用</a>
          <a class="toc__link" href="#slide-6">6 まとめ</a>
        </nav>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div>
          <p class="topbar__eyebrow">SLIDE OUTPUT</p>
          <p class="topbar__title">AI SUMMER SCHOOL Day4</p>
        </div>
        <div class="topbar__actions">
          <p class="topbar__counter" id="slide-counter">1 / 6</p>
          <button class="action-button" type="button" data-action="print">印刷 / PDF</button>
        </div>
      </header>

      <main class="deck" id="deck">
        <section class="slide" id="slide-1" data-title="表紙">
          <div class="slide__frame slide__frame--image">
            <img class="slide-image" src="./images/day4-0.png" alt="AI SUMMER SCHOOL Day4 の表紙スライド">
            <div class="slide__number">1</div>
          </div>
        </section>

        <section class="slide" id="slide-2" data-title="対話型デザイン">
          <div class="slide__frame slide__frame--image">
            <img class="slide-image" src="./images/day4-1.png" alt="画像生成AIが一発生成から対話型デザインへ移ることを示すスライド">
            <div class="slide__number">2</div>
          </div>
        </section>

        <section class="slide" id="slide-3" data-title="4つの使い分け">
          <div class="slide__frame slide__frame--image">
            <img class="slide-image" src="./images/day4-2.png" alt="4つの画像生成AIツールの使い分けを示す比較スライド">
            <div class="slide__number">3</div>
          </div>
        </section>

        <section class="slide" id="slide-4" data-title="6つの実務">
          <div class="slide__frame slide__frame--image">
            <img class="slide-image" src="./images/day4-3.png" alt="画像生成AIが変える6つの実務を示すスライド">
            <div class="slide__number">4</div>
          </div>
        </section>

        <section class="slide" id="slide-5" data-title="安全な商用利用">
          <div class="slide__frame slide__frame--image">
            <img class="slide-image" src="./images/day4-4.png" alt="安全な商用利用の判断軸を示すスライド">
            <div class="slide__number">5</div>
          </div>
        </section>

        <section class="slide" id="slide-6" data-title="まとめ">
          <div class="slide__frame slide__frame--image">
            <img class="slide-image" src="./images/day4-5.png" alt="AI SUMMER SCHOOL Day4 のまとめスライド">
            <div class="slide__number">6</div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="day04_app.js"></script>
</body>
</html>
