<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day5｜Google AI StudioでノーコードWebアプリ構築</title>
  <link rel="stylesheet" href="day05_styles.css">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 19 6v5c0 4.5-2.8 8-7 10-4.2-2-7-5.5-7-10V6z"/><path d="m8.5 12 2.2 2.2 4.8-5"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M8 14c-1.1-1-2-2.3-2-4.2a6 6 0 1 1 12 0c0 1.9-.9 3.2-2 4.2-.6.6-1 1.3-1 2H9c0-.7-.4-1.4-1-2Z"/><path d="M12 1v2M3.8 4.8l1.4 1.4M20.2 4.8l-1.4 1.4"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 1.7 6.3L20 10l-6.3 1.7L12 18l-1.7-6.3L4 10l6.3-1.7zM19 16l.7 2.3L22 19l-2.3.7L19 22l-.7-2.3L16 19l2.3-.7z"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.6M8.2 13.2l7.6 4.6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.6 2.6L16.5 9"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h12l3 3v15H5z"/><path d="M8 3v6h8V3M8 20v-6h8v6"/></symbol>
  </svg>

  <div class="app-shell">
    <aside class="rail">
      <div class="rail__brand"><span>AI Summer school</span><strong>DAY 5</strong></div>
      <nav id="rail-nav" class="rail__nav" aria-label="スライド一覧"></nav>
      <p class="rail__hint">← → キーでも移動できます</p>
    </aside>
    <section class="workspace">
      <header class="topbar">
        <div><span class="topbar__eyebrow">AIやろうぜ in Fukuoka</span><strong>Google AI Studioでつくる、はじめてのWebアプリ</strong></div>
        <div class="topbar__actions"><span id="counter">1 / 17</span><button id="print-button" type="button">印刷 / PDF</button></div>
      </header>
      <main id="deck" class="deck" aria-live="polite"></main>
      <div class="controls"><button id="prev" type="button" aria-label="前のページ">←</button><button id="next" type="button" aria-label="次のページ">→</button></div>
    </section>
  </div>
  <script src="day05_app.js"></script>
</body>
</html>
